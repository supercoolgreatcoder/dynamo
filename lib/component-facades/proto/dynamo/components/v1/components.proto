syntax = "proto3";
package dynamo.components.v1;

message ItemError {
  string kind = 1;
  string message = 2;
  bool retryable = 3;
}

message PreprocessItem {
  string item_id = 1;
  bytes openai_request_json = 2;
  bool preserve_omitted_max_tokens = 3;
  string lora_name = 4;
  int64 deadline_unix_ms = 5;
  // Descriptor-driven gateways request an opaque carrier so their dynamic
  // value model never materializes one JSON number per prompt token.
  bool packed_tokens_only = 6;
}

message PreprocessBatchRequest { repeated PreprocessItem items = 1; }

message PreparedItem {
  string item_id = 1;
  bytes normalized_openai_request_json = 2;
  bytes backend_request_json = 3;
  map<string, string> annotations = 4;
  bool prompt_injected_reasoning = 5;
  bytes guided_tool_constraint_json = 6;
  optional uint64 image_tokens = 7;
  ItemError error = 8;
  bool uses_tool_call_structural_tag = 9;
  uint64 prompt_tokens = 10;
  uint64 image_count = 11;
  uint64 video_count = 12;
  uint64 audio_count = 13;
  // Canonical selection-service request derived from backend_request_json.
  // Keeping this translation in the Dynamo facade prevents gateways from
  // knowing Dynamo's routing schema.
  bytes selector_request_json = 14;
  // Prompt token IDs travel as packed protobuf integers. The JSON payloads
  // deliberately omit this large hot-path field.
  repeated uint32 token_ids = 15;
  // Little-endian u32 token IDs. Populated instead of token_ids when the
  // request sets packed_tokens_only.
  bytes token_ids_le = 16;
}

message PreprocessBatchResponse { repeated PreparedItem items = 1; }

service Preprocessor {
  rpc Prepare(PreprocessItem) returns (PreparedItem);
  rpc PrepareBatch(PreprocessBatchRequest) returns (PreprocessBatchResponse);
}

message JsonItem {
  string item_id = 1;
  bytes payload_json = 2;
  int64 deadline_unix_ms = 3;
  repeated uint32 token_ids = 4;
  bytes token_ids_le = 5;
}

message JsonBatchRequest { repeated JsonItem items = 1; }
message JsonResult {
  string item_id = 1;
  bytes payload_json = 2;
  ItemError error = 3;
}
message JsonBatchResponse { repeated JsonResult items = 1; }

message WorkerMutation {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    UPSERT = 1;
    PATCH = 2;
    DELETE = 3;
  }
  string item_id = 1;
  Operation operation = 2;
  uint64 worker_id = 3;
  bytes payload_json = 4;
  int64 deadline_unix_ms = 5;
}
message WorkerMutationBatchRequest { repeated WorkerMutation items = 1; }

message ReservationEvent {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    PREFILL_COMPLETE = 1;
    ADD_OUTPUT_BLOCK = 2;
    FREE = 3;
  }
  string item_id = 1;
  Operation operation = 2;
  string reservation_id = 3;
  optional double decay_fraction = 4;
  int64 deadline_unix_ms = 5;
}
message ReservationEventBatchRequest { repeated ReservationEvent items = 1; }

message ReadyRequest {}

service Selector {
  rpc Select(JsonItem) returns (JsonResult);
  rpc SelectAndReserve(JsonItem) returns (JsonResult);
  rpc CreateReservation(JsonItem) returns (JsonResult);
  rpc SelectBatch(JsonBatchRequest) returns (JsonBatchResponse);
  rpc SelectAndReserveBatch(JsonBatchRequest) returns (JsonBatchResponse);
  rpc CreateReservationBatch(JsonBatchRequest) returns (JsonBatchResponse);
  rpc MutateWorkersBatch(WorkerMutationBatchRequest) returns (JsonBatchResponse);
  rpc ApplyReservationEventsBatch(ReservationEventBatchRequest) returns (JsonBatchResponse);
  rpc Ready(ReadyRequest) returns (JsonResult);
}

// Thin streaming adapter over an existing Dynamo backend pipeline. The adapter
// does not implement generation or detokenization; its engine is supplied by a
// Dynamo vLLM/SGLang/TRT-LLM wrapper and emits canonical BackendOutput values.
message WorkerOpen {
  string request_id = 1;
  bytes backend_request_json = 2;
  int64 deadline_unix_ms = 3;
  // The preprocessor omits token IDs from backend_request_json; carry them
  // separately so raw prefill does not expand large prompts into JSON arrays.
  repeated uint32 token_ids = 4;
  bytes token_ids_le = 5;
}
message WorkerCancel { string request_id = 1; }
message WorkerInput {
  oneof frame {
    WorkerOpen open = 1;
    WorkerCancel cancel = 2;
  }
}
message WorkerOutput {
  string request_id = 1;
  bytes annotated_backend_chunk_json = 2;
  bool finished = 3;
  ItemError error = 4;
}

service WorkerBridge {
  rpc Process(stream WorkerInput) returns (stream WorkerOutput);
}

message ChatWorkerRequest {
  string request_id = 1;
  bytes backend_request_json = 2;
  bytes normalized_openai_request_json = 3;
  bool prompt_injected_reasoning = 4;
  bool uses_tool_call_structural_tag = 5;
  uint64 prompt_tokens = 6;
  optional uint64 image_tokens = 7;
  uint64 image_count = 8;
  uint64 video_count = 9;
  uint64 audio_count = 10;
  int64 deadline_unix_ms = 11;
  repeated uint32 token_ids = 12;
  bytes token_ids_le = 13;
  // Opaque Dynamo prefill disaggregated_params JSON. The facade wraps this in
  // PreprocessedRequest.prefill_result for a decode worker; gateway graphs do
  // not need to serialize Dynamo's backend request type.
  bytes prefill_result_json = 14;
}

// Preferred worker-side boundary for gateway graphs. A Dynamo wrapper supplies
// the backend engine and Dynamo's canonical postprocessor produces OpenAI chunks.
service ChatWorkerBridge {
  rpc Generate(ChatWorkerRequest) returns (stream PostprocessOutput);
  // Same Dynamo backend request, but retain canonical annotated backend
  // output so a prefill handoff is not turned into an OpenAI text chunk.
  rpc GenerateRaw(ChatWorkerRequest) returns (stream WorkerOutput);
}

message PostprocessOpen {
  string request_id = 1;
  bytes normalized_openai_request_json = 2;
  bool prompt_injected_reasoning = 3;
  bool uses_tool_call_structural_tag = 4;
  uint64 prompt_tokens = 5;
  optional uint64 image_tokens = 6;
  uint64 image_count = 7;
  uint64 video_count = 8;
  uint64 audio_count = 9;
}
message PostprocessChunk {
  string request_id = 1;
  // Canonical Dynamo Annotated<BackendOutput> JSON.
  bytes annotated_backend_chunk_json = 2;
  bool finished = 3;
}
message PostprocessCancel { string request_id = 1; }
message PostprocessInput {
  oneof frame {
    PostprocessOpen open = 1;
    PostprocessChunk chunk = 2;
    PostprocessCancel cancel = 3;
  }
}
message PostprocessOutput {
  string request_id = 1;
  bytes openai_chunk_json = 2;
  bool finished = 3;
  ItemError error = 4;
}

service Postprocessor {
  rpc Process(stream PostprocessInput) returns (stream PostprocessOutput);
}
