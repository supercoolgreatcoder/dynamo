[package]
name = "dynamo-component-facades"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Batched gRPC facades over canonical Dynamo preprocessing, selection, and postprocessing."

[package.metadata.cargo-machete]
ignored = ["prost"]

[dependencies]
dynamo-kv-router = { workspace = true, features = ["standalone-selection"] }
dynamo-llm = { path = "../llm", default-features = false }
dynamo-runtime = { workspace = true }
dynamo-ext-proc = { path = "../../deploy/inference-gateway/ext-proc" }

anyhow = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
futures = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true, features = ["net"] }
tonic = { workspace = true }
tonic-health = { workspace = true }
tonic-reflection = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tower = { version = "0.5", features = ["util"] }
