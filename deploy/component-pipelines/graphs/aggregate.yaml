api:
  openapi: ../specs/openai-chat.yaml
  operationId: createChatCompletion
components:
  preprocessor:
    openapi: ../specs/preprocessor.yaml
    baseUrl: http://dynamo-preprocessor:50051
  selector:
    openapi: ../specs/selector.yaml
    baseUrl: http://dynamo-selector:50051
  workers:
    openapi: ../specs/chat-worker.yaml
    discovery: {group: aggregate}
steps:
  - id: prepare
    call:
      component: preprocessor
      operationId: prepare
      timeoutMs: 10000
      input:
        item_id: "$.request.id"
        openai_request_json: "$.request.body"
        preserve_omitted_max_tokens: false
        lora_name: ""
        deadline_unix_ms: 0
      output:
        normalized_request: "$.response.normalized_openai_request_json"
        backend_request: "$.response.backend_request_json"
        selector_request: "$.response.selector_request_json"
        prompt_injected_reasoning: "$.response.prompt_injected_reasoning"
        uses_tool_call_structural_tag: "$.response.uses_tool_call_structural_tag"
        prompt_tokens: "$.response.prompt_tokens"
        image_tokens: "$.response.image_tokens"
        image_count: "$.response.image_count"
        video_count: "$.response.video_count"
        audio_count: "$.response.audio_count"
      batch: {maxSize: 32, lingerUs: 100}
  - id: select
    call:
      component: selector
      operationId: select
      timeoutMs: 2000
      input:
        item_id: "$.request.id"
        payload_json: "$.vars.selector_request"
        deadline_unix_ms: 0
      output:
        worker_endpoint: "$.response.payload_json.endpoint"
  - id: generate
    call:
      component: workers
      operationId: generate
      target: "$.vars.worker_endpoint"
      timeoutMs: 120000
      input:
        request_id: "$.request.id"
        backend_request_json: "$.vars.backend_request"
        normalized_openai_request_json: "$.vars.normalized_request"
        prompt_injected_reasoning: "$.vars.prompt_injected_reasoning"
        uses_tool_call_structural_tag: "$.vars.uses_tool_call_structural_tag"
        prompt_tokens: "$.vars.prompt_tokens"
        image_tokens: "$.vars.image_tokens"
        image_count: "$.vars.image_count"
        video_count: "$.vars.video_count"
        audio_count: "$.vars.audio_count"
        deadline_unix_ms: 0
      stream: {}
      respond: true
