# Foundation probe for the store-native GMS k8s harness.
#
# Confirms the busybox+Nix-store recipe runs GMS artifacts on a real cluster GPU:
# store-native CPython executes from the NFS-mounted /nix/store, the dynamo _core
# extension loads, torch sees CUDA, the gpu_memory_service package imports, and the
# KV lease record size is the expected 16 bytes.
#
# VALIDATED: runs green in ns mkhadkevich-dev (torch 2.11.0+cu128, cuda True,
# LEASE_RECORD_SIZE 16). Edit the three store paths (RT/GMS/RING) + the engine
# python to your synced closure hashes; see README.md for how the store is synced.
#
#   kubectl -n <ns> apply -f foundation-probe.yaml
#   kubectl -n <ns> logs gms-foundation-probe
#   kubectl -n <ns> delete pod gms-foundation-probe
apiVersion: v1
kind: Pod
metadata:
  name: gms-foundation-probe
  labels: {app: gms-foundation-probe}
spec:
  restartPolicy: Never
  runtimeClassName: nvidia
  tolerations:
  - {effect: NoSchedule, key: nvidia.com/gpu, operator: Exists}
  containers:
  - name: probe
    image: busybox:1.36
    # store-native engine venv python (any of the synced engine-worker-env pythons)
    command: ["/nix/store/REPLACE-vllm-worker-env/bin/python", "-c"]
    args:
    - |
      import torch; print("torch", torch.__version__, "cuda", torch.cuda.is_available(), "n", torch.cuda.device_count(), flush=True)
      import dynamo._core as c; print("core", c.__file__, flush=True)
      import gpu_memory_service; print("gms-import OK", flush=True)
      from gpu_memory_service.integrations.common import kv_lease_client as k
      print("LEASE_RECORD_SIZE", k._KV_LEASE_SHM_RECORD_SIZE, flush=True)
    env:
    - {name: HOME, value: /tmp}
    - {name: LD_LIBRARY_PATH, value: "/usr/lib/x86_64-linux-gnu:/run/opengl-driver/lib"}
    # Prepend the rebuilt runtime (_core) + gms + ring so they override the venv copies.
    - {name: PYTHONPATH, value: "/nix/store/REPLACE-ai-dynamo-runtime/lib/python3.12/site-packages:/nix/store/REPLACE-gpu-memory-service/lib/python3.12/site-packages:/nix/store/REPLACE-gms-rust-ring/lib/python3.12/site-packages"}
    resources:
      limits: {cpu: "4", memory: 16Gi, nvidia.com/gpu: "1"}
    volumeMounts:
    - {mountPath: /nix/store, name: rootfs, subPath: store}
  volumes:
  - name: rootfs
    persistentVolumeClaim: {claimName: rootfs}
